plugins {
    id "com.android.application"
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String env ->
    keystoreProps.getProperty(key) ?: System.getenv(env)
}

android {
    namespace "com.secasaudavel.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.secasaudavel.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "SITE_URL", "\"https://seca-saudavel-monetizacao.onrender.com/\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def storePath = signingValue("storeFile", "SECA_KEYSTORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword signingValue("storePassword", "SECA_KEYSTORE_PASSWORD")
                keyAlias signingValue("keyAlias", "SECA_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "SECA_KEY_PASSWORD")
            }
        }
    }

    // "direct": APK installed straight from a download link; keeps the website checkout.
    // "play": Google Play build; tells the site to hide in-app purchases (Play Payments policy).
    flavorDimensions "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", "\"direct\""
        }
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", "\"play\""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-web:3.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.6.1"
}
